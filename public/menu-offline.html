<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>GTC Menu Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      color: #0f172a;
      font-family: Inter, system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 50px -30px rgba(15, 23, 42, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GTC Menu sedang offline</h1>
    <p>Jika menu pernah dibuka sebelumnya, buka lagi <strong>/daftarmenu</strong> saat koneksi kembali tersedia untuk menyegarkan data terbaru.</p>
  </div>
</body>
</html>
